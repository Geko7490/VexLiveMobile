name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: node --check app/src/main/assets/game.js
      - run: node --check bridge/server.js
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk VexLiveMobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VexLiveMobile-APK
          path: VexLiveMobile.apk
      - name: Publish alpha APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0-alpha >/dev/null 2>&1 || gh release create v1.0.0-alpha --title "VEX Live Mobile 1.0 Alpha" --notes "Experimental debug build; live access requires configuration." --prerelease
          gh release upload v1.0.0-alpha VexLiveMobile.apk --clobber
