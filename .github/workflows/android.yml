name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          MANAGER="$(find "$SDK/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -x "$MANAGER"
          if [ ! -f "$SDK/platforms/android-34/android.jar" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            "$MANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle pinned Three.js engine
        run: |
          npm pack three@0.160.1 --pack-destination /tmp
          tar -xOf /tmp/three-0.160.1.tgz package/build/three.module.js > app/src/main/assets/three.module.js
          tar -xOf /tmp/three-0.160.1.tgz package/LICENSE > app/src/main/assets/THREE-LICENSE.txt
      - run: node --check app/src/main/assets/game.js
      - run: node --check app/src/main/assets/soundtrack.js
      - run: node --input-type=module --check < app/src/main/assets/studio3d.js
      - run: node --check bridge/server.js
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk VexLiveMobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VexLiveMobile-APK
          path: VexLiveMobile.apk
      - name: Publish alpha APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0-alpha >/dev/null 2>&1 || gh release create v1.1.0-alpha --title "VEX Live Mobile 1.1 Studio Alpha" --notes "Experimental debug build; live access requires configuration." --prerelease
          gh release upload v1.1.0-alpha VexLiveMobile.apk --clobber
